# k3-weather settings (sourced by bin/weather.sh).
# Find coordinates at https://open-meteo.com/en/docs (search box) or any map.
LAT=42.3647
LON=-71.1042
NAME="Cambridge, MA"
# metric or imperial
UNITS=imperial
# seconds between refreshes (1800 = 30 min)
INTERVAL=1800
# 1 = switch wifi off between refreshes to save battery, 0 = leave it on
WIFI_SAVER=1
# 0 = stay awake between refreshes (keys work any time; uses more battery).
# 1 = suspend between refreshes and wake on the RTC timer (saves battery).
#     While suspended keys do nothing: slide the power switch to wake it,
#     then press a key within a minute.
SLEEP=0
# Uncomment if the screen comes out as a negative:
#EXTRA_ARGS="--no-invert"

# --- MBTA view: press M to switch the bottom half between the next two
# days and live departures. Up to 3 rows, each "STOP ROUTE DIRECTION LABEL".
#   STOP: stop ID, e.g. from api-v3.mbta.com/stops?filter[route]=91
#         (subway stations use the place-... ID, e.g. place-cntsq = Central)
#   DIRECTION: 0 or 1. Red Line: 0 = Ashmont/Braintree, 1 = Alewife.
#              Buses: 0 = outbound, 1 = inbound.
# Unknown stop IDs show "Unavailable (UnknownStop)". Remove all MBTA rows to
# turn the MBTA view off.
MBTA1="place-cntsq Red 1 Red to Alewife @ Central"
MBTA2="place-cntsq Red 0 Red to Ashmont/Braintree @ Central"
# seconds between refreshes while the MBTA view is showing (300 = 5 min)
MBTA_INTERVAL=300
# bottom half at start: mbta or days
VIEW=mbta
